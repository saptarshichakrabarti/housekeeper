name: Build platform wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  wheels:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, arch: x86_64}
          - {os: ubuntu-24.04-arm, arch: aarch64}
          - {os: macos-13, arch: x86_64}
          - {os: macos-14, arch: arm64}
          - {os: windows-latest, arch: AMD64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pypa/cibuildwheel@v3.1
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal
          CIBW_ENVIRONMENT_LINUX: 'PATH=$HOME/.cargo/bin:$PATH'
          CIBW_TEST_COMMAND: "python {project}/scripts/verify_bundled_core.py"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  source-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --sdist
      - name: Verify Cargo-less source installation
        shell: bash
        run: |
          python -m venv /tmp/housekeeper-python-fallback
          PATH=/tmp/housekeeper-python-fallback/bin:/usr/bin:/bin \
            /tmp/housekeeper-python-fallback/bin/python -m pip install --no-deps dist/*.tar.gz
          PATH=/tmp/housekeeper-python-fallback/bin:/usr/bin:/bin \
            /tmp/housekeeper-python-fallback/bin/python -c \
            'from housekeeper.acceleration.capability_detection import detect_backend; assert detect_backend().capabilities()["backend"] == "python"'
      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
