# Every key below is read by the code. An unknown key is a startup error, not a silent no-op.
workspace:
  database: workspace/inventory.sqlite
  logs_dir: workspace/logs
  reports_dir: workspace/reports
scanner:
  batch_size: 5000            # entries staged per transaction while walking
  stay_on_filesystem: false   # true: never descend into a different mounted device
  max_file_size_for_content_analysis: 1073741824
  excluded_paths: []
  excluded_names: []
hashing: {algorithm: sha256, quick_hash_chunk_bytes: 1048576, quick_hash_middle_samples: 2, full_hash_block_bytes: 8388608}
archives: {max_members: 100000, max_declared_uncompressed_bytes: 536870912000}
documents: {max_text_characters: 2000000, store_normalized_text: true}
images: {enable_perceptual_hashing: true, max_pixels: 200000000, create_contact_sheets: true, contact_sheet_columns: 4, contact_sheet_cell_pixels: 160, contact_sheet_max_members: 36}
directory_overlap: {minimum_files: 5, minimum_bytes: 1048576, containment_threshold: 0.90}
reporting:
  large_file_threshold_bytes: 1073741824
  # true replaces the mount path with "<source>" in reports and the CSV/JSONL exports, keeping the
  # source-relative path. Review manifests are never redacted: they are revalidated by absolute path
  # and hash before a move. See docs/threat_model.md.
  redact_source_paths: false
incremental: {detect_renames: true, reuse_unchanged_stages: true}
content_store: {store_normalized_text: true, compress_text: true, store_image_thumbnails: true, thumbnail_max_dimension: 512}
dashboard: {enabled: true, host: 127.0.0.1, port: 8765, open_browser: true, read_only: false, page_size: 100, maximum_page_size: 500, allow_non_loopback: false}
graph: {enabled: true, default_max_nodes: 500, hard_max_nodes: 5000, default_max_edges: 2000, hard_max_edges: 20000, minimum_edge_confidence: 0.70}
performance:
  # "auto" classifies from the path (network mounts) and is otherwise conservative. Set this
  # explicitly to ssd on solid-state storage — nothing measures the drive for you any more.
  storage_profile: auto
  profiles:
    hdd: {full_hash_workers: 1, parser_workers: 2}
    ssd: {full_hash_workers: 4, parser_workers: 4}
    network: {full_hash_workers: 1, parser_workers: 2}
  # Depart from the selected profile here, by name. Anything else is rejected at load.
  overrides: {}
  batch_size: 1000
  database_writer_queue_size: 10000
  parser_timeout_seconds: 60
  parser_memory_limit_mb: 1024
