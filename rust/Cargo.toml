[package]
name = "housekeeper-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# rayon + mmap enable update_mmap_rayon: multithreaded BLAKE3 over a memory-mapped file, whose
# output is identical to the sequential update (BLAKE3 is a tree hash), so digests stay compatible.
blake3 = { version = "1", features = ["rayon", "mmap"] }
serde_json = "1.0"
sha2 = "0.10"
