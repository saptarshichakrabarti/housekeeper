[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-housekeeper"
version = "0.1.0"
description = "Conservative, auditable inventory and review tooling for disorganized drives"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["PyYAML>=6", "Jinja2>=3"]

[project.optional-dependencies]
analysis = ["puremagic>=1.16", "rapidfuzz>=3", "Pillow>=10", "ImageHash>=4", "exifread>=3", "mutagen>=1.47", "PyMuPDF>=1.23", "python-docx>=1", "openpyxl>=3", "python-pptx>=0.6"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
desktop = ["pywebview>=5"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "httpx>=0.27"]

[project.scripts]
housekeeper = "housekeeper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
housekeeper = ["dashboard/static/*", "dashboard/static/vendor/*", "dashboard/templates/*.html", "dashboard/templates/fragments/*.html", "reports/templates/*.html.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[[tool.mypy.overrides]]
# Optional desktop-only dependency (the `desktop` extra); most installs never have it, and it
# ships no type stubs.
module = "webview"
ignore_missing_imports = true
